name: Publish

on:
  push:
    # tags:
    #   - "v[0-9]+.[0-9]+.[0-9]+*"
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]
  workflow_dispatch:

env:
  PUB_ENVIRONMENT: bot.github

jobs:
  commit_filter:
    name: Check commit tag
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.commit_tag.outputs.run_ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Check for documentation-only commit
        id: commit_tag
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fiq '[docs]'; then
            echo "run_ci=false" >> "$GITHUB_OUTPUT"
            echo "Skipping test and publication jobs for a documentation-only commit."
          else
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: commit_filter
    if: ${{ needs.commit_filter.outputs.run_ci == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
          - platform: macos-latest
          - platform: windows-latest
          - platform: ios
          - platform: android
            arch: x86_64
    runs-on: ${{ (matrix.platform == 'android' && 'ubuntu-latest') || (matrix.platform == 'ios' && 'macos-latest') || matrix.platform }}

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Setup dependencies ubuntu
        if: ${{ matrix.platform == 'ubuntu-latest' }}
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3 && sudo DEBIAN_FRONTEND=noninteractive apt-get install  -o Acquire::Retries=3 -y --no-install-recommends libssl-dev libpcre3

      - name: Setup dependencies windows
        if: ${{ matrix.platform == 'windows-latest' }}
        run: |
          choco install openssl -y

      - name: Setup environment
        if: ${{ matrix.platform != 'android' }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
    
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      
      - name: Run tests on desktop platforms
        if: ${{ matrix.platform != 'android' && matrix.platform != 'ios' }}
        run: |
          flutter test -j 1 --reporter expanded

      - name: Run tests on iOS
        if: ${{ matrix.platform == 'ios' }}
        shell: bash
        run: |
          IOS_DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 16/ && /Shutdown/ {print $2; exit}')"
          if [ -z "$IOS_DEVICE_ID" ]; then
            IOS_DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Shutdown/ {print $2; exit}')"
          fi

          if [ -z "$IOS_DEVICE_ID" ]; then
            echo "No available iOS simulator found"
            xcrun simctl list devices available
            exit 1
          fi

          xcrun simctl boot "$IOS_DEVICE_ID" || true
          xcrun simctl bootstatus "$IOS_DEVICE_ID" -b
          flutter devices
          flutter test -d "$IOS_DEVICE_ID" --reporter expanded

      - name: Setup Flutter path for Android
        if: ${{ matrix.platform == 'android' }}
        id: flutter-path
        run: |
          echo "FLUTTER_PATH=$(which flutter || echo '')" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: Run tests on Android
        if: ${{ matrix.platform == 'android' }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PATH: ${{ env.PATH }}
        with:
          api-level: 30
          arch: x86_64
          profile: Nexus 6
          ram-size: 2048M
          disk-size: 4096M
          script: |
            
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            
            # Install Flutter if not available in PATH
            git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter
            export PATH="$HOME/flutter/bin:$PATH"
            
            flutter pub get
            flutter test 

  publish:
    needs: [commit_filter, test]
    runs-on: ubuntu-latest
    if: ${{ needs.commit_filter.outputs.run_ci == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}

    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - run: |
          dart format --output=none --set-exit-if-changed .
          flutter analyze --fatal-infos

      - name: Publish
        uses: k-paxian/dart-package-publisher@master
        with:
          accessToken: ${{ secrets.PUB_DEV_PUBLISH_ACCESS_TOKEN }}
          refreshToken: ${{ secrets.PUB_DEV_PUBLISH_REFRESH_TOKEN }}
          flutter: true
          skipTests: true
          format: true
          dryRunOnly: ${{ github.ref != 'refs/heads/main' }}
          
