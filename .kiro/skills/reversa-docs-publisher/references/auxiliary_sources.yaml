# Directories scanned by Publisher in auto-discovery of auxiliary HTMLs.
# HTML found must have <meta name="reversa-category" content="..."> to be indexed.

scan_roots:
  - path: "reversa/sdd/"
    description: "SDD specs and outputs from Discovery and Migration agents."
  - path: ".reversa/"
    description: "Artefatos transversais do core."
    exclude:
      - "reversa/docs/"
      - ".reversa/_config/"
      - ".reversa/context/"

categories:
  - id: review
    label: "Code Reviews"
    description: "Annotated PRs generated by reversa-reviewer and similar."
  - id: design-system
    label: "Design System"
    description: "Living Design System do reversa-design-system."
  - id: diagram
    label: "Diagramas"
    description: "Annotated Flowcharts e arquiteturas adicionais."

limits:
  max_depth: 6
  timeout_seconds: 10
