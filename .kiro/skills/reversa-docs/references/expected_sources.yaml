# Fonts expected by the Team Reversa Docs
# Each item declares an artifact of the Reversa core that, if present, feeds one or more pages of the mini-site.
# Missing never blocks: font-dependent pages are omitted gracefully.

sources:
  - id: soul
    path: ".reversa/soul.md"
    producer: "reversa-extract-soul"
    consumed_by:
      - "Storyteller (glossario.html, deck.html)"
      - "Publisher (seed sha256, hero)"
    required_for:
      - "glossario.html"
      - "deck.html (parcialmente)"
    description: "Executive summary of the project. Origin of the glossary and hero title."

  - id: chronicle
    path: ".reversa/chronicle.md"
    producer: "reversa-chronicler"
    consumed_by:
      - "Analyst (timeline.html)"
    required_for:
      - "timeline.html"
    description: "History of events, releases and incidents. Source of the interactive timeline."

  - id: topology
    path: "reversa/sdd/architecture.md"
    producer: "reversa-architect"
    consumed_by:
      - "Mapper (topologia.html)"
    required_for:
      - "topologia.html"
    description: "Topology detected (legacy vs modern vs hybrid). Side-by-side page source."
    optional: true

  - id: sdd_specs
    path: "reversa/sdd/"
    pattern: "*/requirements.md"
    producer: "reversa-writer"
    consumed_by:
      - "Storyteller (features/*.html)"
    required_for:
- "features/<spec>.html (one page per spec)"
    description: "Specs SDD per feature. Each subfolder with requirements.md becomes a detailed page."

  - id: source_code
    path: "."
    pattern: "(legacy project files)"
    producer: "(humano + git)"
    consumed_by:
      - "Mapper (arquitetura.html, modulos.html, modules.json, deps.json)"
      - "Analyst (metricas.html via modules.json)"
    required_for:
      - "arquitetura.html"
      - "modulos.html"
      - "metricas.html"
    description: "Legacy project source code. Source of LOC, complexity and dependencies metrics."
    extraction_scripts:
      - "extract_modules.py"
      - "extract_deps.py"
