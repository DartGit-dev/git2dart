# golden/manifest.yaml
#
# Manifest of golden files issued by Screen Translator. The Inspector consumes
# this file to build constructive parity tests when legacy oracle
# is available and capture was possible.
#
# In v1, automated capture via Docker/Wine/emulator is OQ-02 (not implemented).
# This manifest describes the command suggested by screen; user rotates manually.
# In projects without an executable oracle, this file may exist empty (list of
# golden files with `present: false`) or do not exist, and the Inspector ignores it.

schemaVersion: 1
generatedAt: <ISO-8601>
reversa:
  version: "x.y.z"
producedBy: screen-translator
sourcePlatform: <slug>
targetPlatform: <slug>
oracleAvailable: true | false
oracleHash: "sha256:<hash of binary or oracle container, when applicable>"
oracleCommand: "<base command to invoke the oracle, ex: 'docker run --rm -i legacy-atm:1.0'>"

normalizationRules:
# Rules accepted in byte-by-byte comparison. Everything outside of here is real disagreement.
  - lineEndings: "\n" # convert CRLF → LF before comparing
  - trimTrailingSpaces: false # default: never trimmar
  - stripAnsiColors: false #default: never strippar; ANSI is part of the contract
  - normalizeUtf8: true # convert heterogeneous encoding to UTF-8
  - injectClock: "2026-01-01T00:00:00Z" # fake clock for deterministic capture
  - seedRandom: 42              # seed fixo

screens:
  - name: <canonical-screen-name>
    legacyOrigin: "<file:line>"
    capture:
      command: "<complete capture command, ex: 'echo -e \"1\\n123456\\n0\\n\" | docker run --rm -i legacy-atm:1.0 > screen_login.txt'>"
      expectedExitCode: 0
      determinismStrategy: "fake-clock + fixed-seed"
    file: "tela-login.txt" # path relative to reversa/sdd/screens/golden/
    format: "ansi-byte-stream"      # ansi-byte-stream | png | html-css-snapshot | raw
    present: true # false when the user has not yet run the capture
    captureBy: "<user-or-CI-name>"
    capturedAt: "<ISO-8601>"
    sha256: "<hash of the captured file, or null when present=false>"
    deviations: [DEV-XXX, DEV-YYY] # list of known deviations for this screen
    notes: "<specific observations, e.g. 'oracle emits trailing space that we ignore via trimTrailingSpaces in the comparison'>"

  - name: <second-screen>
    # ...

# Screens for which deterministic capture was not possible.
nonDeterministic:
  - name: <external-clock-screen>
    reason: "<non-determinism source description>"
    fallback: "sampling by N runs; golden file = common to all"
    samples: 5
    deviations: [DEV-021]

# Screens in projects without UI or in skipped mode.
skipped:
  reason: "<ex: legacy is pure batch, Screen Translator agent skipped>"
  emittedAt: <ISO-8601>
