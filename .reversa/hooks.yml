# hooks.yml
# Optional hooks executed before or after Reversa skills forward.
#
# Esquema por gancho:
# command: command that will be suggested (optional: true) or required (optional: false)
# description: short text displayed to the user
# enabled: true | false. Without this field, it is valid as true.
# optional: true (presents clickable link) | false (runs automatically and waits)
#
# Rules:
# Invalid YAML is tolerated here: the skill continues normally, just without hooks.
# There is no condition DSL in this file. If a hook should not run, use enabled: false.
#
# By default, all hooks arrive empty. Add only the ones that make sense for your project.

schema-version: 1

# Ganchos do /reversa-requirements
