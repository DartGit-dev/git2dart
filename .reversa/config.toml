# Organization of specs generated by agents.
# This section is populated by Reversa after Scout suggests a structure
# and the user confirms the choice in the menu (right after the doc_level question).
# To redisplay the menu, remove the entire [specs] section and run Reversa again.
[specs]
layout = "feature-folder"
granularity = "feature"
custom_folders = []
scout_suggestion = "feature"
decided_at = "2026-08-16T15:26:33Z"
